<style>

body{font-family:'DM Sans',sans-serif;background:#F1F5F9;max-width:430px;margin:0 auto;min-height:100vh;}

button:active{opacity:0.85;transform:scale(0.98);}

<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyABvPPmF7TGgkRgDAU0G_rFaP8GzVPt09s",
  authDomain:"laclinica-gestion-ruta.firebaseapp.com",
  projectId:"laclinica-gestion-ruta",
  storageBucket:"laclinica-gestion-ruta.firebasestorage.app",
  messagingSenderId:"486739060933",
  appId:"1:486739060933:web:ec862327bb97f8fd91a8ac"
});
const auth = firebase.auth();
const db   = firebase.firestore();

// ═══════════════════════════════════════════════════════════════
// COLORES
// ═══════════════════════════════════════════════════════════════
const N="#0F2240",N2="#1A3A5C",R="#DC2626",G="#16A34A",
      A="#F59E0B",O="#EA580C",S="#F1F5F9",W="#FFFFFF",
      P="#7C3AED";

// ═══════════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════════
var ST={
  loading:true,user:null,perfil:null,tab:"panel",
  modal:null,subTab:"Todos",toast:null,toastT:null,
  clientes:[],pedidos:[],cobros:[],prospectos:[],
  gastos:[],devoluciones:[],auditoria:[],usuarios:[],
  ruta:[],catalogo:[],
  search:"",filtro:"todos",tutorial:false,tutPaso:0
};

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function $(id){return document.getElementById(id);}
function val(id,def){var el=$(id);return el?el.value.trim():(def||"");}
function h(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;");}
function render(){document.getElementById("root").innerHTML=html();bindCanvas();}
function setState(p){Object.assign(ST,p);render();}

function toast(msg,color,dur){
  color=color||G;dur=dur||2800;
  if(ST.toastT)clearTimeout(ST.toastT);
  var t=setTimeout(function(){setState({toast:null,toastT:null});},dur);
  setState({toast:{msg:msg,color:color},toastT:t});
}

async function audit(accion,modulo,detalle,nivel){
  nivel=nivel||1;
  try{
    await db.collection("auditoria").add({
      uid:ST.user?ST.user.uid:"",
      email:ST.user?ST.user.email:"",
      nombre:ST.perfil?ST.perfil.nombre:"",
      rol:ST.perfil?ST.perfil.rol:"",
      accion:accion,modulo:modulo,detalle:detalle,nivel:nivel,
      fecha:new Date().toLocaleDateString("es-EC"),
      hora:new Date().toLocaleTimeString("es-EC"),
      ts:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// CARGA DE DATOS
// ═══════════════════════════════════════════════════════════════
async function cargarTodo(){
  var cols=["clientes","pedidos","cobros","prospectos","gastos","devoluciones","auditoria","usuarios","ruta","catalogo"];
  try{
    var snaps=await Promise.all(cols.map(function(c){return db.collection(c).get();}));
    snaps.forEach(function(s,i){ST[cols[i]]=s.docs.map(function(d){var o={id:d.id};Object.assign(o,d.data());return o;});});
    render();
  }catch(e){toast("Error cargando datos",R);}
}

// ═══════════════════════════════════════════════════════════════
// HTML PRINCIPAL
// ═══════════════════════════════════════════════════════════════
function html(){
  if(ST.loading)return renderCargando();
  if(!ST.user)return renderLogin();
  if(ST.tutorial)return renderTutorial();
  return renderApp();
}

function renderCargando(){
  return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:'+N+';">'+
    '<div style="font-size:64px;margin-bottom:16px;">🍾</div>'+
    '<h1 style="color:'+W+';font-size:26px;font-weight:800;margin-bottom:6px;">La Clínica</h1>'+
    '<p style="color:#93C5FD;font-size:15px;margin-bottom:40px;">Licores Distribuidora · Lago Agrio</p>'+
    '<div style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.2);border-top-color:'+W+';border-radius:50%;animation:spin 0.8s linear infinite;"></div>'+
  '</div>';
}

function renderLogin(){
  return'<div style="min-height:100vh;background:linear-gradient(160deg,'+N+' 0%,'+N2+' 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;">'+
    renderToast()+
    '<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:40px;">🍾</div>'+
    '<h1 style="color:'+W+';font-size:28px;font-weight:800;margin-bottom:4px;text-align:center;">La Clínica</h1>'+
    '<p style="color:#93C5FD;font-size:16px;margin-bottom:4px;text-align:center;">Licores Distribuidora</p>'+
    '<p style="color:#475569;font-size:13px;margin-bottom:36px;text-align:center;">Lago Agrio · Ecuador</p>'+
    '<div style="width:100%;max-width:360px;">'+
    '<label style="color:#CBD5E1;font-size:14px;font-weight:600;display:block;margin-bottom:8px;">Correo electrónico</label>'+
    '<input id="lEmail" type="email" placeholder="correo@ejemplo.com" style="width:100%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px 16px;color:'+W+';font-size:16px;outline:none;margin-bottom:16px;"/>'+
    '<label style="color:#CBD5E1;font-size:14px;font-weight:600;display:block;margin-bottom:8px;">Contraseña</label>'+
    '<input id="lPass" type="password" placeholder="••••••••" style="width:100%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px 16px;color:'+W+';font-size:16px;outline:none;margin-bottom:8px;"/>'+
    '<button onclick="recuperarPass()" style="background:none;border:none;color:#93C5FD;font-size:14px;cursor:pointer;margin-bottom:20px;padding:0;">¿Olvidaste tu contraseña?</button>'+
    '<button id="btnLogin" onclick="doLogin()" style="width:100%;background:'+A+';border:none;border-radius:16px;padding:16px;color:'+W+';font-size:18px;font-weight:700;cursor:pointer;margin-bottom:12px;">Ingresar al sistema</button>'+
    '<p id="lErr" style="color:#FCA5A5;text-align:center;font-size:14px;display:none;margin-top:8px;"></p>'+
    '</div>'+
    '<p style="color:#334155;font-size:12px;margin-top:40px;text-align:center;">v2.0 · La Clínica Licores Distribuidora</p>'+
  '</div>';
}

var TUTPASOS=[
  {icon:"🏠",t:"Panel Principal",d:"Alertas del día, ruta y accesos rápidos. Primera pantalla al abrir."},
  {icon:"👥",t:"Clientes",d:"Tu base de clientes. Buscá, filtrá y ve cuántos días sin visita tiene cada uno."},
  {icon:"📦",t:"Pedidos",d:"Registrá pedidos en tiempo real. Seguí el estado hasta la entrega con firma digital."},
  {icon:"💰",t:"Cobros",d:"Controlá cobros, abonos y saldos. Te avisa cuando hay vencidos."},
  {icon:"☰",t:"Más módulos",d:"Ruta, catálogo, comisiones, gastos, historial, plantillas WhatsApp y más."},
];

function renderTutorial(){
  var p=ST.tutPaso||0;
  var t=TUTPASOS[p];
  return'<div style="min-height:100vh;background:'+N+';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;">'+
    '<div style="font-size:72px;margin-bottom:24px;">'+t.icon+'</div>'+
    '<h2 style="color:'+W+';font-size:24px;font-weight:800;margin-bottom:12px;text-align:center;">'+t.t+'</h2>'+
    '<p style="color:#93C5FD;font-size:16px;text-align:center;margin-bottom:40px;line-height:1.6;max-width:300px;">'+t.d+'</p>'+
    '<div style="display:flex;gap:8px;margin-bottom:32px;">'+
    TUTPASOS.map(function(_,i){return'<div style="width:'+(i===p?24:8)+'px;height:8px;background:'+(i===p?A:'rgba(255,255,255,0.3)')+';border-radius:4px;"></div>';}).join("")+
    '</div>'+
    '<button onclick="avanzarTut()" style="width:100%;max-width:300px;background:'+A+';border:none;border-radius:16px;padding:16px;color:'+W+';font-size:18px;font-weight:700;cursor:pointer;">'+
    (p<TUTPASOS.length-1?"Siguiente →":"¡Empezar!")+
    '</button>'+
    (p>0?'<button onclick="setState({tutorial:false})" style="background:none;border:none;color:#475569;font-size:14px;cursor:pointer;margin-top:16px;padding:8px;">Saltar</button>':"")+
  '</div>';
}

function renderToast(){
  if(!ST.toast)return"";
  return'<div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:'+ST.toast.color+';color:'+W+';border-radius:14px;padding:12px 20px;font-size:15px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);max-width:90vw;">'+ST.toast.msg+'</div>';
}

function renderApp(){
  var aniv=checkAniversarios();
  var alertas=ST.clientes.filter(function(c){return(c.dias||0)>21;}).length+ST.cobros.filter(function(c){return c.estado==="vencido";}).length;
  var contenido="";
  switch(ST.tab){
    case"clientes":   contenido=renderClientes();break;
    case"pedidos":    contenido=renderPedidos();break;
    case"cobros":     contenido=renderCobros();break;
    case"mas":        contenido=renderMas();break;
    case"ruta":       contenido=renderRuta();break;
    case"catalogo":   contenido=renderCatalogo();break;
    case"historial":  contenido=renderHistorial();break;
    case"prospectos": contenido=renderProspectos();break;
    case"comisiones": contenido=renderComisiones();break;
    case"devoluciones":contenido=renderDevoluciones();break;
    case"grafico":    contenido=renderGrafico();break;
    case"ranking":    contenido=renderRanking();break;
    case"gastos":     contenido=renderGastos();break;
    case"usuarios":   contenido=renderUsuarios();break;
    case"auditoria":  contenido=renderAuditoria();break;
    default:          contenido=renderPanel(aniv);
  }
  return'<div style="padding-bottom:90px;min-height:100vh;" class="fade">'+
    renderToast()+(ST.modal?renderModal():"")+contenido+renderNav(alertas)+
  '</div>';
}

function checkAniversarios(){
  var hoy=new Date();
  var dd=String(hoy.getDate()).padStart(2,"0");
  var mm=String(hoy.getMonth()+1).padStart(2,"0");
  return ST.clientes.filter(function(c){
    if(!c.aniversario)return false;
    var parts=c.aniversario.split("-");
    return parts[1]===mm&&parts[2]===dd;
  });
}

// ═══════════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════════
function renderPanel(aniv){
  var hoy=new Date().toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long"});
  var ventas=ST.pedidos.filter(function(p){return p.estado==="entregado";}).reduce(function(a,p){return a+(p.monto||0);},0);
  var visitados=ST.clientes.filter(function(c){return(c.dias||0)===0;}).length;
  var porCobrar=ST.cobros.filter(function(c){return c.estado!=="cobrado";}).reduce(function(a,c){return a+(c.saldo||0);},0);
  var urgentes=ST.clientes.filter(function(c){return(c.dias||0)>21;}).length;
  var vencidos=ST.cobros.filter(function(c){return c.estado==="vencido";}).length;
  var rol=ST.perfil?ST.perfil.rol:"vendedor";

  return'<div style="background:linear-gradient(135deg,'+N+' 0%,'+N2+' 100%);padding:28px 20px 24px;border-radius:0 0 28px 28px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
      '<div>'+
        '<p style="color:#93C5FD;font-size:13px;margin:0;text-transform:capitalize;">'+hoy+'</p>'+
        '<h1 style="color:'+W+';font-size:22px;font-weight:800;margin:4px 0 2px;">🍾 La Clínica</h1>'+
        '<p style="color:#CBD5E1;font-size:13px;margin:0;">'+(ST.perfil?ST.perfil.nombre:"")+' · '+rolLabel(rol)+'</p>'+
      '</div>'+
      '<button onclick="doLogout()" style="background:rgba(255,255,255,0.12);border:none;border-radius:12px;padding:8px 12px;color:'+W+';font-size:13px;font-weight:600;cursor:pointer;">Salir 🚪</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px;">'+
      stat("Ventas","$"+ventas,"#4ADE80")+
      stat("Visitados",visitados+"/"+ST.clientes.length,"#FCD34D")+
      stat("Por cobrar","$"+porCobrar,"#FCA5A5")+
    '</div>'+
  '</div>'+
  '<div style="padding:0 16px;">'+
  (aniv.length>0?
    '<div style="margin-top:20px;"><h2 style="font-size:16px;font-weight:700;color:'+N+';margin:0 0 10px;">🎂 Aniversarios hoy</h2>'+
    aniv.map(function(c){return'<div style="background:linear-gradient(135deg,#7C3AED,#5B21B6);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;"><span style="font-size:32px;">🎉</span><div style="flex:1;"><p style="font-size:16px;font-weight:700;color:'+W+';margin:0;">'+h(c.nombre)+'</p><p style="font-size:13px;color:#DDD6FE;margin:0;">¡Hoy cumple años el negocio!</p></div><button onclick="abrirWA(\''+h(c.tel||"")+'\',\'aniv\',\''+h(c.nombre)+'\')" style="background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:8px 10px;cursor:pointer;color:'+W+';font-size:20px;">💬</button></div>';}).join("")+
    '</div>':"")+
  ((urgentes>0||vencidos>0)?
    '<div style="margin-top:20px;"><h2 style="font-size:16px;font-weight:700;color:'+N+';margin:0 0 10px;">⚡ Alertas</h2>'+
    (urgentes>0?'<div onclick="setState({tab:\'clientes\'})" style="background:#FFF1F2;border:2px solid '+R+';border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;"><div style="background:'+R+';border-radius:10px;padding:8px;font-size:20px;">⚠️</div><div style="flex:1;"><p style="font-size:16px;font-weight:700;color:'+R+';margin:0;">'+urgentes+' cliente sin visitar</p><p style="font-size:13px;color:#9F1239;margin:0;">Más de 21 días</p></div></div>':"")+
    (vencidos>0?'<div onclick="setState({tab:\'cobros\'})" style="background:#FFFBEB;border:2px solid '+O+';border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;"><div style="background:'+O+';border-radius:10px;padding:8px;font-size:20px;">💰</div><div style="flex:1;"><p style="font-size:16px;font-weight:700;color:'+O+';margin:0;">'+vencidos+' cobro vencido</p></div></div>':"")+
    '</div>':"")+
  '<div style="margin-top:22px;"><h2 style="font-size:16px;font-weight:700;color:'+N+';margin:0 0 10px;">🚀 Acceso rápido</h2>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'+
    qBtn("➕","Nuevo Pedido",N,"setState({tab:'pedidos',modal:{tipo:'nuevoPedido'}})")+
    qBtn("💬","Plantillas WA","#075E54","setState({modal:{tipo:'plantillasWA'}})")+
    qBtn("👤","Nuevo Cliente",P,"setState({tab:'clientes',modal:{tipo:'nuevoCliente'}})")+
    qBtn("💸","Gastos de Ruta","#374151","setState({tab:'gastos'})")+
  '</div></div></div>';
}

function stat(l,v,c){return'<div style="background:rgba(255,255,255,0.1);border-radius:14px;padding:12px 8px;text-align:center;"><div style="color:'+c+';font-size:17px;font-weight:800;margin-bottom:2px;">'+v+'</div><div style="color:#94A3B8;font-size:11px;">'+l+'</div></div>';}
function qBtn(i,l,c,fn){return'<button onclick="'+fn+'" style="background:'+c+';border:none;border-radius:16px;padding:16px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;"><span style="font-size:22px;">'+i+'</span><span style="color:'+W+';font-size:15px;font-weight:700;">'+l+'</span></button>';}
function rolLabel(r){return{dueno:"👑 Dueño",admin:"📊 Administradora",vendedor:"🚗 Vendedor",bodega:"📦 Bodega"}[r]||r;}

// ═══════════════════════════════════════════════════════════════
// NAVEGACIÓN
// ═══════════════════════════════════════════════════════════════
function renderNav(alertas){
  var items=[
    {id:"panel",i:"🏠",l:"Panel"},
    {id:"clientes",i:"👥",l:"Clientes"},
    {id:"pedidos",i:"📦",l:"Pedidos"},
    {id:"cobros",i:"💰",l:"Cobros"},
    {id:"mas",i:"☰",l:"Más"},
  ];
  return'<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:'+W+';border-top:1px solid #E2E8F0;display:flex;z-index:100;padding-bottom:8px;box-shadow:0 -4px 20px rgba(0,0,0,0.08);">'+

    return'<button onclick="setState({tab:\''+item.id+'\'})" style="flex:1;background:none;border:none;padding:10px 0 4px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;">'+

    '</button>';
  }).join("")+
  '</div>';
}

// ═══════════════════════════════════════════════════════════════
// CLIENTES
// ═══════════════════════════════════════════════════════════════
function renderClientes(){
  var dc=function(d){return d>21?R:d>7?O:G;};
  var badges={activo:{bg:"#DCFCE7",c:"#166534",l:"Activo"},pendiente:{bg:"#FEF9C3",c:"#854D0E",l:"Pendiente"},inactivo:{bg:"#FEE2E2",c:"#991B1B",l:"Inactivo"},prospecto:{bg:"#EEF2FF",c:"#3730A3",l:"Prospecto"}};
  var fl=ST.clientes.filter(function(c){
    var s=(c.nombre||"").toLowerCase().indexOf(ST.search.toLowerCase())>=0||(c.encargado||"").toLowerCase().indexOf(ST.search.toLowerCase())>=0;
    var f=ST.filtro==="todos"||c.estado===ST.filtro;
    return s&&f;
  });
  return pageHeader("👥 Clientes ("+ST.clientes.length+")","#1A3A5C",
    '<div style="display:flex;gap:8px;">'+
    '<button onclick="exportarClientes()" style="background:rgba(255,255,255,0.15);border:none;border-radius:12px;padding:8px 12px;color:'+W+';font-size:13px;font-weight:600;cursor:pointer;">📤</button>'+
    '<button onclick="setState({modal:{tipo:\'nuevoCliente\'}})" style="background:'+A+';border:none;border-radius:12px;padding:8px 14px;color:'+W+';font-size:13px;font-weight:700;cursor:pointer;">➕ Nuevo</button>'+
    '</div>')+
  '<div style="background:rgba(255,255,255,0.12);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;margin:0 16px 0;">'+
    '<span style="color:#94A3B8;font-size:18px;">🔍</span>'+
    '<input id="searchIn" value="'+h(ST.search)+'" oninput="setState({search:this.value})" placeholder="Buscar cliente..." style="background:transparent;border:none;outline:none;color:'+W+';font-size:16px;padding:12px 0;flex:1;"/>'+
    (ST.search?'<span onclick="setState({search:\'\'})" style="color:#94A3B8;cursor:pointer;font-size:18px;">✕</span>':"")+
  '</div>'+

function renderModal(){
  var m=ST.modal;if(!m)return"";
  switch(m.tipo){
    case"nuevoCliente":   return modalNuevoCliente();
    case"editarCliente":  return modalEditarCliente(m.cliente);
    case"verCliente":     return modalVerCliente(m.cliente);

    case"firma":          return modalFirma(m);
    case"abono":          return modalAbono(m);
    case"nuevoCobro":     return modalNuevoCobro();

}

function bindCanvas(){
  var canvas=$("firmaCanvas");
  if(!canvas)return;
  var ctx=canvas.getContext("2d");
  canvas.width=canvas.offsetWidth||350;
  canvas.height=180;
  var drawing=false;
  function pos(e){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  canvas.onmousedown=function(e){drawing=true;ctx.beginPath();var p=pos(e);ctx.moveTo(p.x,p.y);};
  canvas.onmouseup=function(){drawing=false;};
  canvas.onmousemove=function(e){if(!drawing)return;var p=pos(e);ctx.lineWidth=2.5;ctx.strokeStyle=N;ctx.lineTo(p.x,p.y);ctx.stroke();};
  canvas.ontouchstart=function(e){drawing=true;ctx.beginPath();var p=pos(e);ctx.moveTo(p.x,p.y);e.preventDefault();};
  canvas.ontouchend=function(){drawing=false;};
  canvas.ontouchmove=function(e){if(!drawing)return;var p=pos(e);ctx.lineWidth=2.5;ctx.strokeStyle=N;ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
}
function limpiarFirma(){var c=$("firmaCanvas");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);}

function doLogin(){
  var email=val("lEmail"),pass=val("lPass");
  var err=$("lErr"),btn=$("btnLogin");
  if(!email||!pass){if(err){err.textContent="Completá todos los campos";err.style.display="block";}return;}
  if(btn){btn.textContent="Ingresando...";btn.disabled=true;}
  auth.signInWithEmailAndPassword(email,pass).catch(function(e){
    if(err){err.textContent="Correo o contraseña incorrectos";err.style.display="block";}
    if(btn){btn.textContent="Ingresar al sistema";btn.disabled=false;}
  });
}

function doLogout(){
  if(!confirm("¿Salir del sistema?"))return;
  audit("Cierre de sesión","Sistema","Logout",1).then(function(){auth.signOut();});
}

function recuperarPass(){
  var email=prompt("Ingresá tu correo:");
  if(!email)return;
  auth.sendPasswordResetEmail(email).then(function(){toast("✅ Correo enviado a "+email,G);}).catch(function(e){toast("Error: "+e.message,R);});
}

async function registrarAbono(id,saldoActual){
  var monto=parseFloat(val("ab_monto")||0);
  if(!monto||monto<=0){toast("Ingresá un monto válido",R);return;}
  if(monto>saldoActual){toast("El abono no puede superar $"+saldoActual,R);return;}
  var c=ST.cobros.find(function(x){return x.id===id;});
  var nuevoSaldo=saldoActual-monto;
  var nuevoAb=(c&&c.abonado||0)+monto;
  try{
    await db.collection("cobros").doc(id).update({saldo:nuevoSaldo,abonado:nuevoAb,estado:nuevoSaldo<=0?"cobrado":"por cobrar"});
    await audit("Abono","Cobros","$"+monto+" → saldo: $"+nuevoSaldo,1);
    toast("✅ Abono de $"+monto+" registrado",G);setState({modal:null});await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

async function marcarCobrado(id){
  if(!confirm("¿Confirmar cobro total?"))return;
  var c=ST.cobros.find(function(x){return x.id===id;});
  try{
    await db.collection("cobros").doc(id).update({estado:"cobrado",saldo:0,abonado:c&&c.monto||0});
    await audit("Cobrado","Cobros","ID: "+id,1);
    toast("✅ Cobro completado",G);await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

function exportarCobros(){
  // Formato Perseo: Doc. No. | Fecha | Vence | Total | Abono | Saldo | Vendedor
  var BOM="\uFEFF"; // UTF-8 BOM para que Excel abra bien tildes
  var cols=["Doc. No.","Cliente","Fecha","Vence","Total","Abono","Saldo","Tipo","Vendedor"];
  var filas=ST.cobros.map(function(c,i){
    return [
      c.factura||(i+1),          // Doc. No. — usa factura o número secuencial
      c.cliente||"",
      c.fecha||"",               // Fecha de registro
      c.vence||"",               // Fecha de vencimiento
      parseFloat(c.monto||0).toFixed(2),
      parseFloat(c.abonado||0).toFixed(2),
      parseFloat(c.saldo||0).toFixed(2),
      c.tipo||"",
      c.vendedor||""
    ].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(",");
  });
  var csv=BOM+cols.join(",")+"\n"+filas.join("\n");
  descargar("cobros_perseo_"+new Date().toLocaleDateString("es-EC").replace(/\//g,"-")+".csv","text/csv;charset=utf-8",csv);
  toast("📤 Exportado formato Perseo",G);
}

function exportarCobrosRendicion(){
  // Solo pendientes y vencidos — hoja de rendición de Cristian
  var BOM="\uFEFF";
  var pendientes=ST.cobros.filter(function(c){return c.estado!=="cobrado";});
  if(pendientes.length===0){toast("No hay cobros pendientes",A);return;}
  var cols=["N°","Doc. No.","Cliente","Fecha","Vence","Total","Abono","Saldo","Tipo","Vendedor"];
  var filas=pendientes.map(function(c,i){
    return [
      i+1,
      c.factura||(i+1),
      c.cliente||"",
      c.fecha||"",
      c.vence||"",
      parseFloat(c.monto||0).toFixed(2),
      parseFloat(c.abonado||0).toFixed(2),
      parseFloat(c.saldo||0).toFixed(2),
      c.tipo||"",
      c.vendedor||""
    ].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(",");
  });
  // Totales al final
  var totalSaldo=pendientes.reduce(function(a,c){return a+(c.saldo||0);},0);
  var totalAbono=pendientes.reduce(function(a,c){return a+(c.abonado||0);},0);
  var totalMonto=pendientes.reduce(function(a,c){return a+(c.monto||0);},0);
  filas.push(['"TOTALES"',"","","","",'"'+totalMonto.toFixed(2)+'"','"'+totalAbono.toFixed(2)+'"','"'+totalSaldo.toFixed(2)+'"',"",""].join(","));
  var csv=BOM+cols.join(",")+"\n"+filas.join("\n");
  descargar("rendicion_cobros_"+new Date().toLocaleDateString("es-EC").replace(/\//g,"-")+".csv","text/csv;charset=utf-8",csv);
  toast("📋 Rendición exportada ("+pendientes.length+" cobros)",G);
}

    await db.collection("prospectos").add({nombre:nom,contacto:cont,tel:val("npr_tel"),zona:val("npr_zona"),tipo:val("npr_tipo")||"Otro",estado:val("npr_est")||"📞 Por contactar",proximoPaso:val("npr_paso"),primerContacto:new Date().toLocaleDateString("es-EC"),ts:firebase.firestore.FieldValue.serverTimestamp()});
    await audit("Nuevo prospecto","Prospectos","Se agregó: "+nom,1);
    toast("✅ Prospecto agregado",G);setState({modal:null});await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

async function convertirProspecto(id){
  var p=ST.prospectos.find(function(x){return x.id===id;});
  if(!p)return;
  if(!confirm("¿Convertir "+p.nombre+" en cliente activo?"))return;
  try{
    await db.collection("clientes").add({nombre:p.nombre,encargado:p.contacto,tel:p.tel||"",zona:p.zona||"",estado:"activo",dias:0,monto:0,pendiente:0,precio:"C",origen:"Ecuador",ts:firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection("prospectos").doc(id).update({estado:"✅ Convertido"});
    await audit("Prospecto convertido","Prospectos",p.nombre,1);
    toast("✅ "+p.nombre+" ahora es cliente",G);await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

// RUTA
async function guardarRuta(){
  var cli=val("nr_cli"),dia=val("nr_dia");
  if(!cli||!dia){toast("Seleccioná cliente y día",R);return;}
  try{
    var c=ST.clientes.find(function(x){return x.nombre===cli;});
    await db.collection("ruta").add({cliente:cli,dia:dia,hora:val("nr_hora"),zona:(c&&c.zona)||"",estado:"pendiente",ts:firebase.firestore.FieldValue.serverTimestamp()});
    await audit("Nuevo en ruta","Ruta",cli+" a "+dia,1);
    toast("✅ Agregado a ruta",G);setState({modal:null});await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

// DEVOLUCIONES
async function guardarDevolucion(){
  var prod=val("nd_prod"),monto=parseFloat(val("nd_monto")||0),motivo=val("nd_motivo");
  if(!prod||!monto||!motivo){toast("Completá los campos obligatorios",R);return;}
  try{
    await db.collection("devoluciones").add({cliente:val("nd_cli"),producto:prod,cantidad:parseInt(val("nd_cant")||1),monto:monto,motivo:motivo,solucion:val("nd_sol"),estado:val("nd_est")||"⏳ Pendiente",fecha:new Date().toLocaleDateString("es-EC"),ts:firebase.firestore.FieldValue.serverTimestamp()});
    await audit("Nueva devolución","Devoluciones","$"+monto+" — "+motivo,1);
    toast("✅ Devolución registrada",G);setState({modal:null});await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

async function resolverDev(id){
  try{
    await db.collection("devoluciones").doc(id).update({estado:"✅ Resuelto"});
    await audit("Devolución resuelta","Devoluciones","ID: "+id,1);
    toast("✅ Marcada como resuelta",G);await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

// USUARIOS
async function crearUsuario(){
  var nom=val("nu_nombre"),email=val("nu_email"),pass=val("nu_pass"),rol=val("nu_rol")||"vendedor";
  if(!nom||!email||!pass){toast("Completá todos los campos",R);return;}
  if(pass.length<8){toast("La contraseña debe tener al menos 8 caracteres",R);return;}
  try{
    var cred=await auth.createUserWithEmailAndPassword(email,pass);
    await db.collection("usuarios").doc(cred.user.uid).set({nombre:nom,email:email,rol:rol,activo:true,creadoEn:firebase.firestore.FieldValue.serverTimestamp()});
    await audit("Nuevo usuario","Usuarios",nom+" ("+rol+")",1);
    toast("✅ Usuario "+nom+" creado",G);setState({modal:null});await cargarTodo();
  }catch(e){
    if(e.code==="auth/email-already-in-use")toast("Ese correo ya está registrado",R);
    else toast("Error: "+e.message,R);
  }
}

async function cambiarPassUsuario(email,id){
  try{
    await auth.sendPasswordResetEmail(email);
    await audit("Reset contraseña","Usuarios",email,1);
    toast("✅ Correo de reset enviado a "+email,G);
  }catch(e){toast("Error: "+e.message,R);}
}

async function toggleUsuario(id,activo){
  if(!confirm(activo?"¿Desactivar este usuario?":"¿Reactivar este usuario?"))return;
  try{
    await db.collection("usuarios").doc(id).update({activo:!activo});
    await audit(activo?"Desactivar usuario":"Reactivar usuario","Usuarios","ID: "+id,1);
    toast(activo?"Usuario desactivado":"Usuario reactivado",G);await cargarTodo();
  }catch(e){toast("Error: "+e.message,R);}
}

// WHATSAPP
async function copiarPlantilla(i){
  try{
    await navigator.clipboard.writeText(PLANTILLAS[i].m);
    toast("✅ Plantilla copiada — pegala en WhatsApp",G);
  }catch(e){
    var ta=document.createElement("textarea");
    ta.value=PLANTILLAS[i].m;
    document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
    toast("✅ Plantilla copiada",G);
  }
}

function abrirWA(tel,tipo,nombre){
  var p=tipo==="aniv"?PLANTILLAS[10].m:PLANTILLAS[0].m;
  var msg=p.replace(/\[NOMBRE\]/g,nombre).replace(/\[NEGOCIO\]/g,nombre);
  var t=(tel||"").replace(/[^0-9]/g,"").replace(/^0/,"");
  window.open("https://wa.me/593"+t+"?text="+encodeURIComponent(msg),"_blank");
}

// UTILS
function descargar(nombre,tipo,contenido){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));
  a.download=nombre;a.click();
}

// ═══════════════════════════════════════════════════════════════
// AUTH LISTENER
// ═══════════════════════════════════════════════════════════════
auth.onAuthStateChanged(async function(user){
  if(user){
    ST.user=user;ST.loading=true;render();
    try{
      var snap=await db.collection("usuarios").doc(user.uid).get();
      if(snap.exists){
        ST.perfil={id:snap.id};Object.assign(ST.perfil,snap.data());
      }else{
        ST.perfil={nombre:user.email.split("@")[0],rol:"dueno",email:user.email};
        await db.collection("usuarios").doc(user.uid).set({nombre:user.email.split("@")[0],email:user.email,rol:"dueno",activo:true,creadoEn:firebase.firestore.FieldValue.serverTimestamp()});
      }
    }catch(e){ST.perfil={nombre:user.email,rol:"dueno",email:user.email};}
    await cargarTodo();
    var tut=localStorage.getItem("lc_tut");
    if(!tut){ST.tutorial=true;ST.tutPaso=0;}
    ST.loading=false;
    await audit("Inicio de sesión","Sistema","Login exitoso",1);
    render();
  }else{
    ST.user=null;ST.perfil=null;ST.loading=false;render();
  }
});

// Tecla Enter en login
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!ST.user){doLogin();}
});
</script>
