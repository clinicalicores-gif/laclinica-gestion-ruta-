function selCliente(id,label){
  var lista=ST.clientes.slice().sort(function(a,b){return(a.nombre||"").localeCompare(b.nombre||"");});
  var opts=lista.map(function(c){
    return'<div data-val="'+h(c.nombre)+'" class="sc-opt" '+
      'onmousedown="elegirCliente(event,\''+id+'\')" '+
      'ontouchend="elegirCliente(event,\''+id+'\')" '+
      'style="padding:12px 16px;font-size:15px;cursor:pointer;border-bottom:1px solid #F1F5F9;">'+
      '<span style="font-weight:600;color:'+N+';">'+h(c.nombre)+'</span>'+
      (c.encargado?'<span style="font-size:12px;color:#94A3B8;display:block;">'+h(c.encargado)+'</span>':"")+
    '</div>';
  }).join("");
  return'<div style="margin-bottom:16px;position:relative;" id="swrap_'+id+'">'+
    '<label style="font-size:14px;font-weight:600;color:'+N+';display:block;margin-bottom:8px;">'+label+' <span style="color:'+R+'">*</span></label>'+
    '<input id="'+id+'_txt" type="text" placeholder="Escribí el nombre..." autocomplete="off" autocorrect="off" spellcheck="false" '+
    'oninput="filtrarSC(\''+id+'\',this.value)" '+
    'onmousedown="abrirSC(\''+id+'\')" ontouchstart="abrirSC(\''+id+'\')" '+
    'style="width:100%;border:2px solid #E2E8F0;border-radius:12px;padding:14px 16px;font-size:16px;outline:none;background:'+W+';box-sizing:border-box;"/>'+
    '<input type="hidden" id="'+id+'"/>'+
    '<div id="'+id+'_drop" style="display:none;position:absolute;top:calc(100% + 2px);left:0;width:100%;background:'+W+';border:2px solid #3B82F6;border-radius:12px;max-height:220px;overflow-y:auto;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.15);">'+
    opts+'</div></div>';
}
function abrirSC(id){
  var d=$(id+"_drop");if(d)d.style.display="block";
}
function filtrarSC(id,q){
  var d=$(id+"_drop");if(!d)return;
  d.style.display="block";
  q=(q||"").toLowerCase();
  var items=d.querySelectorAll(".sc-opt");
  items.forEach(function(el){
    el.style.display=el.textContent.toLowerCase().indexOf(q)>=0?"block":"none";
  });
}
function elegirCliente(e,id){
  if(e&&e.preventDefault)e.preventDefault();
  var target=e.target.closest(".sc-opt");
  if(!target)return;
  var nombre=target.getAttribute("data-val");
  var txt=$(id+"_txt");var hid=$(id);var drp=$(id+"_drop");
  if(txt)txt.value=nombre;
  if(hid)hid.value=nombre;
  if(drp)drp.style.display="none";
}
document.addEventListener("click",function(e){
  document.querySelectorAll("[id$='_drop']").forEach(function(d){
    var wId=d.id.replace("_drop","");
    var w=$("swrap_"+wId);
    if(w&&!w.contains(e.target))d.style.display="none";
  });
});

async function cargarTodo(){
  try{
    var snaps=await Promise.all([
      db.collection("clientes").get(),
      db.collection("pedidos").orderBy("ts","desc").limit(200).get(),
      db.collection("prospectos").get(),
      db.collection("gastos").orderBy("ts","desc").limit(100).get(),
      db.collection("devoluciones").get(),
      db.collection("usuarios").get(),
      db.collection("ruta").get(),
      db.collection("catalogo").get()
    ]);
    ST.clientes=snaps[0].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.pedidos=snaps[1].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.prospectos=snaps[2].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.gastos=snaps[3].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.devoluciones=snaps[4].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.usuarios=snaps[5].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.ruta=snaps[6].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    ST.catalogo=snaps[7].docs.map(function(d){return Object.assign({id:d.id},d.data());});
  }catch(e){console.error("cargarTodo error:",e);}
}

async function audit(accion,modulo,detalle,nivel){
  try{
    if(!ST.user)return;
    await db.collection("auditoria").add({
      uid:ST.user.uid,email:ST.user.email,
      nombre:(ST.perfil&&ST.perfil.nombre)||ST.user.email,
      rol:(ST.perfil&&ST.perfil.rol)||"vendedor",
      accion:accion,modulo:modulo,detalle:detalle,nivel:nivel||1,
      fecha:new Date().toLocaleDateString("es-EC"),
      ts:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){}
}

function checkAniversarios(){
  var hoy=new Date();var d=hoy.getDate();var m=hoy.getMonth()+1;
  return ST.clientes.filter(function(c){
    if(!c.aniversario)return false;
    var parts=c.aniversario.split("/");
    return parseInt(parts[0])===d&&parseInt(parts[1])===m;
  });
}

function confirmarEliminar(col,id,nombre){
  setState({modal:{tipo:"confirmarEliminar",col:col,id:id,nombre:nombre}});
}
async function ejecutarEliminar(){
  var m=ST.modal;
  if(!m||!m.col||!m.id)return;
  try{
    await db.collection(m.col).doc(m.id).delete();
    await audit("Eliminó","Sistema",m.nombre,3);
    toast("🗑️ Eliminado",G);setState({modal:null});await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,R);}
}

// ═══════════════════════════════════════════════════════════════
// CAMBIAR ESTADO PEDIDO
// ═══════════════════════════════════════════════════════════════
async function cambiarEstado(id,nuevoEstado){
  try{
    var update={estado:nuevoEstado};
    if(nuevoEstado==="entregado"){
      update.fechaEntrega=new Date().toLocaleDateString("es-EC");
      // Si es contado → abrir modal de cobro inmediato
      var pedido=ST.pedidos.find(function(p){return p.id===id;});
      if(pedido&&pedido.formaPago==="Contado"){
        await db.collection("pedidos").doc(id).update(update);
        var idx=ST.pedidos.findIndex(function(x){return x.id===id;});
        if(idx>=0)Object.assign(ST.pedidos[idx],update);
        setState({modal:{tipo:"cobrarContado",pedidoId:id,saldo:pedido.monto||0,cliente:pedido.cliente||""}});
        return;
      }
      // Si es crédito → queda en cartera automáticamente
      if(pedido&&pedido.formaPago==="Credito"){
        update.saldoPendiente=pedido.saldoPendiente!==undefined?pedido.saldoPendiente:(pedido.monto||0);
        update.estadoCobro="pendiente";
      }
    }
    await db.collection("pedidos").doc(id).update(update);
    var idx=ST.pedidos.findIndex(function(x){return x.id===id;});
    if(idx>=0)Object.assign(ST.pedidos[idx],update);
    toast("✅ Estado actualizado",G);render();
  }catch(e){toast("Error: "+e.message,R);}
}

function renderPanel(){
  var nombre=(ST.perfil&&ST.perfil.nombre)||"";
  var hoy=new Date().toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long"});
  var aniv=checkAniversarios();
  var sinVisita=ST.clientes.filter(function(c){return(c.dias||0)>21;}).length;
  var enRuta=ST.clientes.filter(function(c){return(c.dias||0)<=7;}).length;
  var pedHoy=ST.pedidos.filter(function(p){return p.fecha===new Date().toLocaleDateString("es-EC");}).length;
  var cartera=ST.pedidos.filter(function(p){return p.formaPago==="Credito"&&p.estadoCobro!=="cobrado";});
  var totalCartera=cartera.reduce(function(a,p){return a+(p.saldoPendiente!==undefined?p.saldoPendiente:(p.monto||0));},0);
  var vencidos=cartera.filter(function(p){return p.vence&&new Date(p.vence)<new Date();}).length;
  var ventasMes=ST.pedidos.filter(function(p){
    var hoyD=new Date();
    var fecha=p.fecha?p.fecha.split("/"):null;
    return fecha&&parseInt(fecha[1])===hoyD.getMonth()+1&&parseInt(fecha[2])===hoyD.getFullYear();
  }).reduce(function(a,p){return a+(p.monto||0);},0);
  var meta=(ST.perfil&&ST.perfil.meta)||25000;

  return'<div style="background:linear-gradient(135deg,'+N+' 0%,#1A3A5C 100%);padding:28px 20px 24px;">'+
    (aniv.length?'<div style="background:rgba(245,158,11,0.2);border:1px solid rgba(245,158,11,0.4);border-radius:14px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">'+
      '<span style="font-size:24px;">🎂</span>'+
      '<div><p style="color:'+A+';font-weight:700;font-size:14px;margin:0;">¡Aniversario hoy!</p>'+
      '<p style="color:rgba(255,255,255,0.8);font-size:13px;margin:0;">'+aniv.map(function(c){return h(c.nombre);}).join(", ")+'</p></div></div>':"")+
    '<p style="color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:4px;text-transform:capitalize;">'+hoy+'</p>'+
    '<h1 style="color:'+W+';font-size:26px;font-weight:900;margin-bottom:4px;">'+
      (nombre?'Hola, '+nombre.split(" ")[0]+'! 👋':'¡Bienvenido! 👋')+
    '</h1>'+
    '<p style="color:#93C5FD;font-size:14px;">La Clínica Licores Distribuidora</p>'+
  '</div>'+
  // Métricas
  '<div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:4px;">'+
    metrica("📦","Pedidos hoy",pedHoy,"","#EFF6FF","#1D4ED8")+
    metrica("💼","Cartera","$"+totalCartera.toFixed(0),vencidos>0?vencidos+" vencidos":"Al día ✅","#FEF3C7","#92400E")+
    metrica("👥","Sin visita",sinVisita,"clientes >21 días","#FEE2E2","#991B1B")+
    metrica("📈","Ventas mes","$"+ventasMes.toFixed(0),Math.round(ventasMes/meta*100)+"% de la meta","#DCFCE7","#166534")+
  '</div>'+
  // Accesos rápidos
  '<div style="padding:0 16px 16px;">'+
    '<p style="font-size:13px;font-weight:700;color:#64748B;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Acceso Rápido</p>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">'+
      accesoRapido("📦","Nuevo Pedido","setState({tab:\'pedidos\',modal:{tipo:\'nuevoPedido\'}})",A)+
      accesoRapido("👥","Clientes","setState({tab:\'clientes\'})",N2)+
      accesoRapido("💼","Cartera","setState({tab:\'cobros\'})",G)+
    '</div>'+
  '</div>'+
  '<div style="height:80px;"></div>';
}
function metrica(icon,label,val,sub,bg,color){
  return'<div style="background:'+bg+';border-radius:16px;padding:14px;">'+
    '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">'+
      '<span style="font-size:18px;">'+icon+'</span>'+
      '<span style="font-size:12px;font-weight:600;color:'+color+';">'+label+'</span>'+
    '</div>'+
    '<div style="font-size:22px;font-weight:900;color:'+color+';">'+val+'</div>'+
    (sub?'<div style="font-size:11px;color:'+color+';opacity:0.7;margin-top:2px;">'+sub+'</div>':"")+
  '</div>';
}
function accesoRapido(icon,label,action,color){
  return'<button onclick="'+action+'" style="background:'+color+';border:none;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">'+
    '<span style="font-size:22px;">'+icon+'</span>'+
    '<span style="font-size:11px;font-weight:700;color:'+W+';text-align:center;line-height:1.2;">'+label+'</span>'+
  '</button>';
}

function renderClientes(){
  var q=(ST.search||"").toLowerCase();
  var fl=ST.clientes.filter(function(c){
    var matchQ=!q||(c.nombre||"").toLowerCase().indexOf(q)>=0||(c.encargado||"").toLowerCase().indexOf(q)>=0;
    var matchF=ST.filtro==="todos"||(ST.filtro==="activo"&&c.estado==="activo")||(ST.filtro==="pendiente"&&(c.pendiente||0)>0)||(ST.filtro==="inactivo"&&c.estado!=="activo");
    return matchQ&&matchF;
  }).sort(function(a,b){return(a.nombre||"").localeCompare(b.nombre||"");});

  var filtros=["todos","activo","pendiente","inactivo"];
  var rol=ST.perfil?ST.perfil.rol:"vendedor";

  return'<div style="background:linear-gradient(135deg,'+N+' 0%,#1A3A5C 100%);padding:28px 20px 20px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">'+
      '<h1 style="color:'+W+';font-size:24px;font-weight:900;">👥 Clientes ('+fl.length+')</h1>'+
      '<div style="display:flex;gap:8px;">'+
        '<button onclick="exportarClientesXLSX()" style="background:rgba(255,255,255,0.15);border:none;border-radius:12px;padding:8px 12px;color:'+W+';font-size:13px;font-weight:600;cursor:pointer;">📤</button>'+
        '<button onclick="setState({modal:{tipo:\'nuevoCliente\'}})" style="background:'+A+';border:none;border-radius:12px;padding:8px 14px;color:'+N+';font-size:13px;font-weight:700;cursor:pointer;">➕ Nuevo</button>'+
      '</div>'+
    '</div>'+
    // Search
    '<div style="background:rgba(255,255,255,0.12);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;">'+
      '<span style="font-size:18px;">🔍</span>'+
      '<input id="cli_search" value="'+h(ST.search||"")+'" placeholder="Buscar cliente..." '+
      'oninput="setState({search:this.value})" '+
      'style="flex:1;border:none;background:transparent;padding:12px 0;font-size:15px;color:'+W+';outline:none;" />'+
      (ST.search?'<button onclick="setState({search:\'\'})" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;">✕</button>':"")+
    '</div>'+
  '</div>'+
  // Filtros
  '<div style="padding:12px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;">'+
  filtros.map(function(f){
    var act=ST.filtro===f;
    var lbl={todos:"Todos",activo:"Activo",pendiente:"Con saldo",inactivo:"Inactivo"}[f];
    return'<button onclick="setState({filtro:\''+f+'\'})" style="white-space:nowrap;background:'+(act?W:"rgba(255,255,255,0.1)")+';color:'+(act?N2:"rgba(255,255,255,0.8)")+';border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;">'+lbl+'</button>';
  }).join("")+
  '</div>'+
  '<div style="padding:12px 16px 80px;display:flex;flex-direction:column;gap:10px;">'+
  (fl.length===0?empty("👥","No hay clientes"+(q?" con ese nombre":"")):
  fl.map(function(c){
    var dias=c.dias||0;
    var sc=dias===0?"#F0FDF4":dias<=7?"#FEF9C3":dias<=14?"#FEF3C7":dias<=21?"#FFF7ED":"#FEE2E2";
    var dc=dias===0?"#166534":dias<=7?"#854D0E":dias<=14?"#92400E":dias<=21?"#C2410C":"#991B1B";
    return'<div style="background:'+W+';border:1.5px solid #E2E8F0;border-radius:18px;padding:16px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">'+
        '<div style="flex:1;min-width:0;">'+
          '<h3 style="font-size:16px;font-weight:700;color:'+N+';margin:0 0 2px;line-height:1.3;">'+h(c.nombre||"")+'</h3>'+
          '<p style="font-size:13px;color:#64748B;margin:0;">'+h(c.encargado||"")+(c.ruc?' · '+h(c.ruc):"")+'</p>'+
        '</div>'+
        '<span style="background:'+(c.estado==="activo"?"#DCFCE7":"#F1F5F9")+';color:'+(c.estado==="activo"?"#166534":"#64748B")+';font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;">'+
          (c.estado==="activo"?"Activo":"Inactivo")+
        '</span>'+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-bottom:10px;">'+
        '<span style="background:'+sc+';color:'+dc+';font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;">'+
          '⏱ '+(dias===0?"Visitado hoy":dias+"d sin visita")+
        '</span>'+
        '<span style="background:#EFF6FF;color:#1D4ED8;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;">⭐ Precio '+h(c.precio||"C")+'</span>'+
        ((c.pendiente||0)>0?'<span style="background:#FEE2E2;color:#991B1B;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;">💰 $'+parseFloat(c.pendiente||0).toFixed(2)+'</span>':"")+
      '</div>'+
      (c.tel?'<p style="font-size:14px;color:#64748B;margin-bottom:10px;">📞 '+h(c.tel)+'</p>':"")+
      '<div style="display:flex;gap:6px;justify-content:flex-end;">'+
        (c.tel?'<a href="https://wa.me/593'+c.tel.replace(/[^0-9]/g,"")+'" target="_blank" style="background:#25D366;border:none;border-radius:10px;padding:8px 10px;text-decoration:none;font-size:16px;display:inline-flex;align-items:center;">💬</a>':"")+
        (c.tel?'<a href="tel:'+c.tel+'" style="background:#DCFCE7;border:none;border-radius:10px;padding:8px 10px;text-decoration:none;font-size:16px;display:inline-flex;align-items:center;">📞</a>':"")+
        '<button onclick="abrirPlantillasCliente(\''+h(c.nombre)+'\',\''+h(c.encargado||"")+'\',\''+h(c.tel||"")+'\',\''+h(c.pendiente||0)+'\')" style="background:#EFF6FF;border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:16px;">✉️</button>'+
        '<button onclick="editarCliente(\''+c.id+'\')" style="background:'+N+';border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:16px;">✏️</button>'+
        (rol==="dueno"||rol==="admin"?'<button onclick="confirmarEliminar(\'clientes\',\''+c.id+'\',\''+h(c.nombre)+'\')" style="background:#FEE2E2;border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:16px;">🗑️</button>':"")+
      '</div>'+
    '</div>';
  }).join(""))+
  '</div>';
}

function editarCliente(id){
  var c=ST.clientes.find(function(x){return x.id===id;});
  if(!c)return;
  setState({modal:{tipo:"editarCliente",cliente:JSON.parse(JSON.stringify(c))}});
}

// Estado temporal del pedido en edición
var PEDIDO_ITEMS=[];  // [{codigo,nombre,cantidad,precioUnitario,origen,sistema}]

function renderPedidos(){
  var rol=ST.perfil?ST.perfil.rol:"vendedor";
  var fs=ST.filtroSistema||"Todos";
  var filtros=["Todos","Perseo","Importados","Mixto"];

  // Agrupar pedidos por cliente
  var porCliente={};
  ST.pedidos.forEach(function(p){
    var cli=p.cliente||"Sin cliente";
    if(!porCliente[cli])porCliente[cli]=[];
    porCliente[cli].push(p);
  });

  // Filtrar por sistema
  var grupos=Object.keys(porCliente).sort().map(function(cli){
    var peds=porCliente[cli].filter(function(p){
      return fs==="Todos"||(p.sistema||"Perseo")===fs;
    });
    return{cliente:cli,pedidos:peds};
  }).filter(function(g){return g.pedidos.length>0;});

  var estados={
    tomado:{bg:"#EEF2FF",c:"#3730A3",l:"📝 Tomado"},
    facturado:{bg:"#FEF9C3",c:"#854D0E",l:"🧾 Facturado"},
    despachado:{bg:"#FEF3C7",c:"#92400E",l:"📦 Despachado"},
    entregado:{bg:"#DCFCE7",c:"#166534",l:"✅ Entregado"},
    cancelado:{bg:"#FEE2E2",c:"#991B1B",l:"❌ Cancelado"}
  };

  return'<div style="background:linear-gradient(135deg,'+N+' 0%,#1A3A5C 100%);padding:28px 20px 20px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">'+
      '<h1 style="color:'+W+';font-size:24px;font-weight:900;">📦 Pedidos</h1>'+
      '<button onclick="PEDIDO_ITEMS=[];setState({modal:{tipo:\'nuevoPedido\'}})" style="background:'+A+';border:none;border-radius:14px;padding:10px 16px;color:'+N+';font-size:15px;font-weight:800;cursor:pointer;">➕ Nuevo</button>'+
    '</div>'+
    '<p style="color:#93C5FD;font-size:13px;">'+ST.pedidos.length+' pedidos registrados</p>'+
  '</div>'+
  // Filtro sistema
  '<div style="padding:12px 16px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;">'+
  filtros.map(function(f){
    var act=fs===f;
    var icons={"Todos":"Todos","Perseo":"🇪🇨 Perseo","Importados":"🇨🇴 Import.","Mixto":"🔀 Mixto"};
    return'<button onclick="setState({filtroSistema:\''+f+'\'})" style="white-space:nowrap;background:'+(act?W:"rgba(15,34,64,0.08)")+';color:'+(act?N2:"#475569")+';border:2px solid '+(act?N2:"#E2E8F0")+';border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;">'+icons[f]+'</button>';
  }).join("")+
  '</div>'+
  '<div style="padding:12px 16px 80px;display:flex;flex-direction:column;gap:16px;">'+
  (grupos.length===0?empty("📦","No hay pedidos"):
  grupos.map(function(g){
    return'<div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;">'+
        '<h3 style="font-size:14px;font-weight:800;color:'+N+';flex:1;">'+h(g.cliente)+'</h3>'+
        '<span style="font-size:12px;color:#94A3B8;">'+g.pedidos.length+' pedido(s)</span>'+
      '</div>'+
      g.pedidos.map(function(p){
        var e=estados[p.estado]||estados.tomado;
        var sis=p.sistema||"Perseo";
        var sisC=sis==="Perseo"?"#EFF6FF":sis==="Importados"?"#FEF3C7":"#F3E8FF";
        var sisT=sis==="Perseo"?"#1D4ED8":sis==="Importados"?"#92400E":"#6B21A8";
        var sisI=sis==="Perseo"?"🇪🇨":sis==="Importados"?"🇨🇴":"🔀";
        return'<div style="background:'+W+';border:1.5px solid #E2E8F0;border-radius:16px;padding:14px;margin-bottom:8px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">'+
            '<div>'+
              '<p style="font-size:13px;color:#64748B;margin:0;">'+h(p.fecha||"")+(p.factura&&p.factura!=="Pendiente"?" · Ref: "+h(p.factura):"")+'</p>'+
              '<p style="font-size:13px;color:#64748B;margin:0;">'+h(p.formaPago||"")+(p.vendedor?" · "+h(p.vendedor):"")+'</p>'+
            '</div>'+
            '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">'+
              '<span style="background:'+e.bg+';color:'+e.c+';font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;">'+e.l+'</span>'+
              '<span style="background:'+sisC+';color:'+sisT+';font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;">'+sisI+' '+sis+'</span>'+
            '</div>'+
          '</div>'+
          // Productos
          (p.productos&&Array.isArray(p.productos)?
            '<div style="background:#F8FAFC;border-radius:10px;padding:8px 10px;margin-bottom:8px;">'+
            p.productos.map(function(pr){
              return'<p style="font-size:13px;color:'+N+';margin:0 0 2px;">• '+h(pr.cantidad||1)+'x '+h(pr.nombre||"")+(pr.subtotal?' — $'+parseFloat(pr.subtotal).toFixed(2):"")+'</p>';
            }).join("")+
            '</div>'
          :
            (p.productosNacional?'<div style="background:#EFF6FF;border-radius:10px;padding:6px 10px;margin-bottom:4px;font-size:12px;color:#1D4ED8;">🇪🇨 '+h(p.productosNacional)+'</div>':"")+ 
            (p.productosImportado?'<div style="background:#FEF3C7;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:12px;color:#92400E;">🇨🇴 '+h(p.productosImportado)+'</div>':"")+
            (p.productos&&!Array.isArray(p.productos)?'<p style="font-size:13px;color:#64748B;margin-bottom:8px;">'+h(p.productos)+'</p>':"")
          )+
          '<div style="display:flex;justify-content:space-between;align-items:center;">'+
            '<span style="font-size:20px;font-weight:900;color:'+N+';">$'+parseFloat(p.monto||0).toFixed(2)+'</span>'+
            '<div style="display:flex;gap:6px;">'+
              (p.estado==="tomado"&&(rol==="admin"||rol==="dueno")?'<button onclick="cambiarEstado(\''+p.id+'\',\'facturado\')" style="background:'+A+';border:none;border-radius:10px;padding:7px 12px;cursor:pointer;color:'+N+';font-size:12px;font-weight:700;">Facturar</button>':"")+
              (p.estado==="facturado"&&(rol==="bodega"||rol==="dueno"||rol==="admin")?'<button onclick="cambiarEstado(\''+p.id+'\',\'despachado\')" style="background:'+P+';border:none;border-radius:10px;padding:7px 12px;cursor:pointer;color:'+W+';font-size:12px;font-weight:700;">Despachar</button>':"")+
              (p.estado==="despachado"&&(rol==="vendedor"||rol==="bodega"||rol==="dueno")?'<button onclick="cambiarEstado(\''+p.id+'\',\'entregado\')" style="background:'+G+';border:none;border-radius:10px;padding:7px 12px;cursor:pointer;color:'+W+';font-size:12px;font-weight:700;">✅ Entregar</button>':"")+
              (p.estado!=="cancelado"?'<button onclick="confirmarEliminar(\'pedidos\',\''+p.id+'\',\'pedido de '+h(p.cliente)+'\')" style="background:#FEE2E2;border:none;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:14px;">🗑️</button>':"")+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("")+
    '</div>';
  }).join(""))+
  '</div>';
}

function modalNuevoPedido(){
  var itemsHtml=PEDIDO_ITEMS.length===0?
    '<p style="text-align:center;color:#94A3B8;font-size:14px;padding:16px;">Aún no hay productos. Buscá y agregá abajo.</p>'
    :PEDIDO_ITEMS.map(function(it,i){
      return'<div style="background:#F8FAFC;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">'+
        '<div style="flex:1;min-width:0;">'+
          '<p style="font-size:13px;font-weight:700;color:'+N+';margin:0;line-height:1.3;">'+h(it.nombre)+'</p>'+
          '<p style="font-size:12px;color:#64748B;margin:0;">'+h(it.cantidad)+'x $'+parseFloat(it.precioUnitario).toFixed(2)+' = $'+parseFloat(it.subtotal).toFixed(2)+'</p>'+
          '<p style="font-size:11px;color:'+(it.sistema==="Importados"?"#92400E":"#1D4ED8")+';margin:0;">'+(it.sistema==="Importados"?"🇨🇴 Importado":"🇪🇨 Perseo")+'</p>'+
        '</div>'+
        '<button onclick="quitarItemPedido('+i+')" style="background:#FEE2E2;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;">✕</button>'+
      '</div>';
    }).join("");

  var total=PEDIDO_ITEMS.reduce(function(a,it){return a+it.subtotal;},0);
  var totalIVA=total*1.15;

  return ov(
    mh("📦 Nuevo Pedido")+
    // Cliente
    selCliente("np_cli","Cliente")+
    // Referencia (opcional)
    '<div style="margin-bottom:16px;">'+

function buscarProductoPedido(q){
  var drop=$("np_drop");if(!drop)return;
  if(!q||q.length<2){drop.style.display="none";return;}
  q=q.toLowerCase();
  var res=ST.catalogo.filter(function(p){
    return p.disponible!=="Sin stock"&&(
      (p.nombre||"").toLowerCase().indexOf(q)>=0||
      (p.codigo||"").toLowerCase().indexOf(q)>=0
    );
  }).slice(0,15);
  if(res.length===0){drop.style.display="none";return;}
  drop.innerHTML=res.map(function(p){
    return'<div onmousedown="seleccionarProducto(\''+h(p.codigo)+'\',\''+h(p.nombre)+'\','+parseFloat(p.precioC||0)+',\''+h(p.categoria)+'\')" '+
      'ontouchend="seleccionarProducto(\''+h(p.codigo)+'\',\''+h(p.nombre)+'\','+parseFloat(p.precioC||0)+',\''+h(p.categoria)+'\')" '+
      'style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #F1F5F9;">'+
      '<p style="font-size:14px;font-weight:600;color:'+N+';margin:0;">'+h(p.nombre)+'</p>'+
      '<p style="font-size:12px;color:#64748B;margin:0;">'+h(p.categoria)+' · Precio C: $'+parseFloat(p.precioC||0).toFixed(2)+'</p>'+
    '</div>';
  }).join("");
  drop.style.display="block";
}

function seleccionarProducto(codigo,nombre,precio,categoria){
  var drop=$("np_drop");var busq=$("np_busq");
  if(drop)drop.style.display="none";
  if(busq)busq.value="";
  // Verificar si ya está en la lista
  var existe=PEDIDO_ITEMS.findIndex(function(it){return it.codigo===codigo;});
  if(existe>=0){
    PEDIDO_ITEMS[existe].cantidad+=1;
    PEDIDO_ITEMS[existe].subtotal=PEDIDO_ITEMS[existe].cantidad*PEDIDO_ITEMS[existe].precioUnitario;
  } else {
    var sis=$("np_sistema")?$("np_sistema").value||"Perseo":"Perseo";
    PEDIDO_ITEMS.push({codigo:codigo,nombre:nombre,cantidad:1,precioUnitario:precio,subtotal:precio,sistema:sis});
  }
  // Re-render modal preservando valores
  var cli=$("np_cli")?$("np_cli").value:"";
  var cliTxt=$("np_cli_txt")?$("np_cli_txt").value:"";
  setState({modal:{tipo:"nuevoPedido"}});
  setTimeout(function(){
    if($("np_cli"))$("np_cli").value=cli;
    if($("np_cli_txt"))$("np_cli_txt").value=cliTxt;
  },10);
}

function quitarItemPedido(i){
  PEDIDO_ITEMS.splice(i,1);
  var cli=$("np_cli")?$("np_cli").value:"";
  var cliTxt=$("np_cli_txt")?$("np_cli_txt").value:"";
  setState({modal:{tipo:"nuevoPedido"}});
  setTimeout(function(){
    if($("np_cli"))$("np_cli").value=cli;
    if($("np_cli_txt"))$("np_cli_txt").value=cliTxt;
  },10);
}

async function guardarNuevoPedido(){
  if(ST._guardandoPedido){toast("Guardando, esperá...",A);return;}
  var cli=val("np_cli");
  if(!cli){toast("Seleccioná un cliente",R);return;}
  if(PEDIDO_ITEMS.length===0){toast("Agregá al menos un producto",R);return;}
  ST._guardandoPedido=true;
  try{
    var total=PEDIDO_ITEMS.reduce(function(a,it){return a+it.subtotal;},0);
    var totalIVA=total*1.15;
    var data={
      cliente:cli,
      productos:PEDIDO_ITEMS.map(function(it){return Object.assign({},it);}),
      monto:parseFloat(total.toFixed(2)),
      montoConIVA:parseFloat(totalIVA.toFixed(2)),
      factura:val("np_factura")||"",
      tipoDocumento:val("np_tipoDoc")||"Factura",
      formaPago:val("np_pago")||"Contado",
      vence:val("np_vence")||"",
      sistema:val("np_sistema")||"Perseo",
      notas:val("np_notas")||"",
      estado:"tomado",
      estadoCobro:"pendiente",
      saldoPendiente:parseFloat(total.toFixed(2)),
      vendedor:(ST.perfil&&ST.perfil.nombre)||"",
      fecha:new Date().toLocaleDateString("es-EC"),
      ts:firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection("pedidos").add(data);
    await audit("Nuevo pedido","Pedidos","Para: "+cli+" $"+total.toFixed(2),1);
    PEDIDO_ITEMS=[];
    toast("✅ Pedido guardado",G);setState({modal:null});await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,R);}
  finally{ST._guardandoPedido=false;}
}

async function registrarCobroContado(pedidoId,total){
  var tipo=val("cc_tipo")||"Efectivo";
  var ref=tipo==="Transferencia"?val("cc_ref"):(tipo==="Mixto"?val("cc_refmix"):"");
  var efec=tipo==="Mixto"?parseFloat(val("cc_efec")||0):total;
  var trans=tipo==="Mixto"?parseFloat(val("cc_trans")||0):0;
  try{
    await db.collection("pedidos").doc(pedidoId).update({
      estadoCobro:"cobrado",saldoPendiente:0,
      formaCobro:tipo,refCobro:ref,
      montoEfectivo:efec,montoTransferencia:trans,
      fechaCobro:new Date().toLocaleDateString("es-EC")
    });
    var idx=ST.pedidos.findIndex(function(x){return x.id===pedidoId;});
    if(idx>=0)Object.assign(ST.pedidos[idx],{estadoCobro:"cobrado",saldoPendiente:0});
    toast("✅ Cobrado. $"+total.toFixed(2),G);setState({modal:null});render();
  }catch(e){toast("Error: "+e.message,R);}
}

async function registrarCobroCartera(pedidoId,saldoActual){
  var monto=parseFloat(val("cv_monto")||0);
  if(!monto||monto<=0){toast("Ingresá el monto",R);return;}
  var nuevoSaldo=Math.max(0,saldoActual-monto);
  var estado=nuevoSaldo===0?"cobrado":"parcial";
  try{
    await db.collection("pedidos").doc(pedidoId).update({
      saldoPendiente:nuevoSaldo,estadoCobro:estado,
      formaCobro:val("cv_tipo")||"Efectivo",
      refCobro:val("cv_ref")||"",
      fechaCobro:new Date().toLocaleDateString("es-EC")
    });
    var idx=ST.pedidos.findIndex(function(x){return x.id===pedidoId;});
    if(idx>=0)Object.assign(ST.pedidos[idx],{saldoPendiente:nuevoSaldo,estadoCobro:estado});
    toast(nuevoSaldo===0?"✅ Cobrado completo":"💰 Abono registrado — saldo: $"+nuevoSaldo.toFixed(2),G);
    setState({modal:null});render();
  }catch(e){toast("Error: "+e.message,R);}
}

function enviarPlantillaWA(plId,nombre,dueno,tel,saldo){
  var pl=PLANTILLAS.find(function(p){return p.id===parseInt(plId);});
  if(!pl)return;
  var msg=pl.texto
    .replace(/\[NOMBRE\]/g,nombre||"")
    .replace(/\[DUENO\]/g,dueno||nombre||"")
    .replace(/\[NEGOCIO\]/g,nombre||"")
    .replace(/\[FACTURA\]/g,"")
    .replace(/\[MONTO\]/g,"")
    .replace(/\[SALDO\]/g,parseFloat(saldo||0).toFixed(2))
    .replace(/\[FECHA\]/g,new Date().toLocaleDateString("es-EC"));
  var telLimpio=(tel||"").replace(/[^0-9]/g,"");
  var url=telLimpio?
    "https://wa.me/593"+telLimpio+"?text="+encodeURIComponent(msg):
    "https://wa.me/?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
  setState({modal:null});
}

function togglePrecio(elId){
  var el=$(elId);if(!el)return;
  var p=el.getAttribute("data-p");
  if(el.textContent==="••••"){el.textContent="$"+p;el.style.color="#1E40AF";}
  else{el.textContent="••••";el.style.color="#64748B";}
}

async function toggleDisponible(id,actual){
  var nuevo=actual==="Disponible"?"Sin stock":"Disponible";
  try{
    await db.collection("catalogo").doc(id).update({disponible:nuevo});
    var idx=ST.catalogo.findIndex(function(x){return x.id===id;});
    if(idx>=0)ST.catalogo[idx].disponible=nuevo;
    render();toast(nuevo==="Disponible"?"✅ Disponible":"❌ Sin stock","#3B82F6",1500);
  }catch(e){toast("Error: "+e.message,R);}
}

async function actualizarProducto(id){
  var nom=val("ep_nom");
  if(!nom){toast("Ingresá el nombre",R);return;}
  try{
    var data={nombre:nom,categoria:val("ep_cat")||"General",
      precioA:parseFloat(val("ep_pa")||0),precioB:parseFloat(val("ep_pb")||0),
      precioC:parseFloat(val("ep_pc")||0),disponible:val("ep_disp")||"Disponible"};
    await db.collection("catalogo").doc(id).update(data);
    var idx=ST.catalogo.findIndex(function(x){return x.id===id;});
    if(idx>=0)Object.assign(ST.catalogo[idx],data);
    toast("✅ Producto actualizado",G);setState({modal:null});render();
  }catch(e){toast("Error: "+e.message,R);}
}

function renderComisiones(){

function renderHistorial(){
  var meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  var ventasPorMes=new Array(12).fill(0);
  ST.pedidos.filter(function(p){return p.estado==="entregado";}).forEach(function(p){
    if(p.fecha){
      var parts=p.fecha.split("/");
      if(parts.length>=2){var m=parseInt(parts[1])-1;if(m>=0&&m<12)ventasPorMes[m]+=p.monto||0;}
    }
  });
  var maxV=Math.max.apply(null,ventasPorMes)||1;
  return pageHeader("📈 Historial de Ventas","#4A235A","#6C3483","")+
  '<div style="padding:16px;padding-bottom:80px;">'+
    '<div style="background:'+W+';border-radius:16px;padding:16px;margin-bottom:16px;">'+
      '<p style="font-size:14px;font-weight:700;color:'+N+';margin-bottom:16px;">Ventas por mes</p>'+
      '<div style="display:flex;align-items:flex-end;gap:6px;height:120px;">'+
      meses.map(function(m,i){
        var pct=ventasPorMes[i]/maxV*100;
        var actMes=new Date().getMonth()===i;
        return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">'+
          '<span style="font-size:10px;color:#64748B;font-weight:600;">$'+Math.round(ventasPorMes[i])+'</span>'+
          '<div style="width:100%;background:'+(actMes?"#3B82F6":"#BFDBFE")+';border-radius:4px 4px 0 0;height:'+Math.max(4,pct)+'%;transition:height 0.5s;"></div>'+
          '<span style="font-size:10px;color:'+(actMes?"#3B82F6":"#94A3B8")+';font-weight:'+(actMes?"700":"400")+';">'+m+'</span>'+
        '</div>';
      }).join("")+
      '</div>'+
    '</div>'+
    // Top clientes
    '<p style="font-size:14px;font-weight:700;color:'+N+';margin-bottom:10px;">🏆 Top 10 clientes</p>'+
    renderRankingLista()+
  '</div>';
}

function renderRankingLista(){
  var cliMap={};
  ST.pedidos.filter(function(p){return p.estado==="entregado";}).forEach(function(p){
    if(!cliMap[p.cliente||""])cliMap[p.cliente||""]=0;
    cliMap[p.cliente||""]+=p.monto||0;
  });
  var lista=Object.keys(cliMap).map(function(k){return{nombre:k,total:cliMap[k]};})
    .sort(function(a,b){return b.total-a.total;}).slice(0,10);
  if(lista.length===0)return empty("🏆","Sin ventas registradas");
  return'<div style="display:flex;flex-direction:column;gap:8px;">'+
  lista.map(function(c,i){
    var medals=["🥇","🥈","🥉"];
    return'<div style="background:'+W+';border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;">'+
      '<span style="font-size:18px;min-width:28px;">'+(medals[i]||"#"+(i+1))+'</span>'+
      '<span style="flex:1;font-size:14px;font-weight:600;color:'+N+';">'+h(c.nombre)+'</span>'+
      '<span style="font-size:15px;font-weight:700;color:#2563EB;">$'+c.total.toFixed(2)+'</span>'+
    '</div>';
  }).join("")+
  '</div>';
}

  return pageHeader("🏆 Ranking Clientes","#7D6608","#B7950B","")+
  '<div style="padding:16px;padding-bottom:80px;">'+
    renderRankingLista()+
  '</div>';
}

function renderGrafico(){
  var dias=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var ventasDia=new Array(7).fill(0);
  var meta=(ST.perfil&&ST.perfil.meta)||25000;
  var metaDia=meta/26;
  ST.pedidos.filter(function(p){return p.estado==="entregado";}).forEach(function(p){
    if(p.fecha){
      var parts=p.fecha.split("/");
      if(parts.length>=3){
        var fecha=new Date(parts[2],parseInt(parts[1])-1,parseInt(parts[0]));
        var dow=fecha.getDay();
        ventasDia[dow]+=p.monto||0;
      }
    }
  });
  var maxV=Math.max(Math.max.apply(null,ventasDia),metaDia)||1;
  return pageHeader("📊 Gráfico de Ventas","#145A32","#1E8449","")+
  '<div style="padding:16px;padding-bottom:80px;">'+
    '<div style="background:'+W+';border-radius:16px;padding:16px;margin-bottom:16px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'+
        '<p style="font-size:14px;font-weight:700;color:'+N+';margin:0;">Ventas por día</p>'+
        '<div style="display:flex;align-items:center;gap:8px;font-size:12px;">'+
          '<div style="width:12px;height:12px;background:#3B82F6;border-radius:2px;"></div><span style="color:#64748B;">Ventas</span>'+
          '<div style="width:12px;height:12px;background:#FCA5A5;border-radius:2px;"></div><span style="color:#64748B;">Meta</span>'+
        '</div>'+
      '</div>'+
      '<div style="display:flex;align-items:flex-end;gap:8px;height:140px;">'+
      dias.map(function(d,i){
        var pct=ventasDia[i]/maxV*100;
        var mPct=metaDia/maxV*100;
        return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">'+
          '<div style="width:100%;position:relative;height:'+(Math.max(4,pct))+'%;display:flex;align-items:flex-end;justify-content:center;">'+
            '<div style="width:100%;background:#3B82F6;border-radius:4px 4px 0 0;height:100%;"></div>'+
          '</div>'+
          '<div style="width:80%;height:2px;background:#FCA5A5;margin-bottom:4px;"></div>'+
          '<span style="font-size:10px;color:#64748B;">'+d+'</span>'+
        '</div>';
      }).join("")+
      '</div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'+
      metrica("📈","Total ventas","$"+ST.pedidos.filter(function(p){return p.estado==="entregado";}).reduce(function(a,p){return a+(p.monto||0);},0).toFixed(0),"este mes","#EFF6FF","#1D4ED8")+
      metrica("🎯","Meta mensual","$"+meta.toLocaleString(),Math.round(ST.pedidos.filter(function(p){return p.estado==="entregado";}).reduce(function(a,p){return a+(p.monto||0);},0)/meta*100)+"% logrado","#DCFCE7","#166534")+
    '</div>'+
  '</div>';
}

async function crearUsuario(){
  var nom=val("nu_nom"),email=val("nu_email"),pass=val("nu_pass"),rol=val("nu_rol");
  if(!nom||!email||!pass){toast("Completá todos los campos",R);return;}
  if(pass.length<6){toast("La contraseña debe tener mínimo 6 caracteres",R);return;}
  try{
    var cred=await auth.createUserWithEmailAndPassword(email,pass);
    await db.collection("usuarios").doc(cred.user.uid).set({
      nombre:nom,email:email,rol:rol||"vendedor",activo:true,
      creadoEn:firebase.firestore.FieldValue.serverTimestamp()
    });
    toast("✅ Usuario creado",G);setState({modal:null});await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,R);}
}

// ═══════════════════════════════════════════════════════════════
function exportarCarteraXLSX(){
  var pendientes=ST.pedidos.filter(function(p){
    return p.formaPago==="Credito"&&p.estadoCobro!=="cobrado";
  });
  if(pendientes.length===0){toast("No hay cartera pendiente",A);return;}
  var ws_data=[["Doc. No.","Cliente","Fecha","Vence","Total","Abono","Saldo","Vendedor"]];
  pendientes.forEach(function(p,i){
    var saldo=p.saldoPendiente!==undefined?p.saldoPendiente:(p.monto||0);
    var abono=(p.monto||0)-saldo;
    ws_data.push([p.factura||"REF-"+(i+1),p.cliente||"",p.fecha||"",p.vence||"",
      parseFloat(p.monto||0),parseFloat(abono),parseFloat(saldo),p.vendedor||""]);
  });
  var ws=XLSX.utils.aoa_to_sheet(ws_data);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Cartera Perseo");
  XLSX.writeFile(wb,"cartera_perseo_"+new Date().toLocaleDateString("es-EC").replace(/\//g,"-")+".xlsx");
  toast("📤 Excel exportado",G);
}

function exportarRendicionXLSX(){
  var pendientes=ST.pedidos.filter(function(p){
    return p.formaPago==="Credito"&&p.estadoCobro!=="cobrado";
  });
  if(pendientes.length===0){toast("No hay pendientes",A);return;}
  var ws_data=[["N°","Doc. No.","Cliente","Fecha","Vence","Total","Abono","Saldo","Vendedor"]];
  var totMonto=0,totAbono=0,totSaldo=0;
  pendientes.forEach(function(p,i){
    var saldo=p.saldoPendiente!==undefined?p.saldoPendiente:(p.monto||0);
    var abono=(p.monto||0)-saldo;
    totMonto+=p.monto||0;totAbono+=abono;totSaldo+=saldo;
    ws_data.push([i+1,p.factura||"REF-"+(i+1),p.cliente||"",p.fecha||"",p.vence||"",
      parseFloat(p.monto||0),parseFloat(abono),parseFloat(saldo),p.vendedor||""]);
  });
  ws_data.push(["","","","","TOTALES",parseFloat(totMonto.toFixed(2)),parseFloat(totAbono.toFixed(2)),parseFloat(totSaldo.toFixed(2)),""]);
  var ws=XLSX.utils.aoa_to_sheet(ws_data);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Rendición");
  XLSX.writeFile(wb,"rendicion_"+new Date().toLocaleDateString("es-EC").replace(/\//g,"-")+".xlsx");
  toast("📋 Rendición exportada",G);
}

function exportarClientesXLSX(){
  var ws_data=[["Nombre Local","Encargado","RUC","Teléfono","Dirección","Email","Precio","Estado","Días sin visita"]];
  ST.clientes.sort(function(a,b){return(a.nombre||"").localeCompare(b.nombre||"");}).forEach(function(c){
    ws_data.push([c.nombre||"",c.encargado||"",c.ruc||"",c.tel||"",c.dir||"",c.email||"",c.precio||"C",c.estado||"activo",c.dias||0]);
  });
  var ws=XLSX.utils.aoa_to_sheet(ws_data);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Clientes");
  XLSX.writeFile(wb,"clientes_laclinica_"+new Date().toLocaleDateString("es-EC").replace(/\//g,"-")+".xlsx");
  toast("📤 Excel exportado",G);
}

    case"agregarRuta":     return modalAgregarRuta();
    case"nuevoProducto":   return modalNuevoProducto();
    case"editProducto":    return modalEditProducto();
    case"nuevoProspecto":  return modalNuevoProspecto();
    case"nuevaDev":        return modalNuevaDev();
    case"nuevoGasto":      return modalNuevoGasto();
    case"nuevoUsuario":    return modalNuevoUsuario();
    case"selPlantillaCliente": return modalSelPlantillaCliente();
    case"previewPlantilla": return modalPreviewPlantilla();
    case"confirmarEliminar": return modalConfirmarEliminar();
    default: return"";
  }
}

function renderApp(){
  var contenido="";
  switch(ST.tab){
    case"panel":     contenido=renderPanel();break;
    case"clientes":  contenido=renderClientes();break;
    case"pedidos":   contenido=renderPedidos();break;
    case"cobros":    contenido=renderCobros();break;
    case"mas":       contenido=renderMas();break;
    case"ruta":      contenido=renderRuta();break;
    case"catalogo":  contenido=renderCatalogo();break;
    case"historial": contenido=renderHistorial();break;
    case"prospectos":contenido=renderProspectos();break;
    case"comisiones":contenido=renderComisiones();break;
    case"devoluciones":contenido=renderDevoluciones();break;
    case"plantillas":contenido=renderPlantillas();break;
    case"grafico":   contenido=renderGrafico();break;
    case"ranking":   contenido=renderRanking();break;
    case"gastos":    contenido=renderGastos();break;
    case"auditoria": contenido=renderAuditoria();break;
    case"usuarios":  contenido=renderUsuarios();break;
    default:         contenido=renderPanel();
  }
  return contenido+renderNav()+renderModal()+renderToast();
}

function html(){
  if(ST.loading)return renderCargando();
  if(!ST.user)return renderLogin();
  if(ST.tutorial)return renderTutorial();
  return renderApp();
}

function render(){
  document.getElementById("root").innerHTML=html();
}

// ═══════════════════════════════════════════════════════════════
// AUTH + INIT
// ═══════════════════════════════════════════════════════════════
auth.onAuthStateChanged(async function(user){
  if(user){
    ST.user=user;
    try{
      var doc=await db.collection("usuarios").doc(user.uid).get();
      ST.perfil=doc.exists?Object.assign({id:doc.id},doc.data()):
        {nombre:user.email,rol:"vendedor",comision:1.5,meta:25000,bono:100};
    }catch(e){ST.perfil={nombre:user.email,rol:"vendedor",comision:1.5,meta:25000,bono:100};}
    var tutVisto=localStorage.getItem("lc_tut");
    ST.loading=false;
    ST.tutorial=!tutVisto;
    ST.tutPaso=0;
    await cargarTodo();
    render();
  } else {
    ST.user=null;ST.perfil=null;ST.loading=false;
    render();
  }
});

render();
</script>
